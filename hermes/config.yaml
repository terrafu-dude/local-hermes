# Hermes Agent config for a fully-local setup.
# The model provider is the local Gufo server on this Docker network
# (Strix Halo-native engine: Qwen3.8-27B Q4_K_XL + DFlash2 spec-draft).
# No API keys, no cloud model calls.

model:
  provider: custom
  model: qwen27-q4            # Gufo-served Qwen3.8-27B (Q4_K_XL, 262K native ctx)
  base_url: http://gufo:8080/v1
  api_key: "none"             # local server doesn't validate it, but the header is sent

# Gufo serves ONE model for subagent/delegated tasks too (already resident),
# so delegation stays on the same endpoint and clears the 64K context floor.
# Match max_concurrent_children to Gufo's --sessions: the gateway/desktop uses a
# slot, the main chat another, so with 3 sessions you have ~1 free for a child.
# Raise it (toward 4) if you run Gufo at 64K/6-session instead.
delegation:
  model: qwen27-q4
  base_url: http://gufo:8080/v1
  api_key: "none"
  max_concurrent_children: 1

# Web-dashboard plugins (dashboard-only "services" tab + installed skills):
plugins:
  enabled:
    - services

# Fully-local voice (free): faster-whisper STT + piper TTS, no cloud keys.
# Engines (faster-whisper, piper-tts, av<19) are baked into the image via the
# Dockerfile. Whisper model + piper voice download on first use into $HOME/.cache.
stt:
  enabled: true
  provider: local          # faster-whisper (free, local)
  local:
    model: base            # tiny | base | small | medium | large-v3 | turbo
tts:
  provider: piper          # local neural TTS (free); set tts.piper.voice to switch
